<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <title>MySurge 模块安装</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #1668dc;
      --warn-bg: #fff7e6;
      --warn: #8a4b08;
      --app: #e8f1ff;
      --enhancement: #f2eafe;
      --generic: #e9f8ef;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --card: #181d23;
        --text: #f2f4f7;
        --muted: #a4acb8;
        --line: #2c333d;
        --accent: #69a7ff;
        --warn-bg: #32250f;
        --warn: #ffd28a;
        --app: #162a45;
        --enhancement: #2d2341;
        --generic: #183425;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    main {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 42px);
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 8px 0 24px;
      color: var(--muted);
      max-width: 720px;
    }

    .notice {
      margin: 0 0 22px;
      padding: 14px 16px;
      border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
      border-radius: 14px;
      background: var(--warn-bg);
      color: var(--warn);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    button, .install {
      border: 0;
      border-radius: 10px;
      font: inherit;
      cursor: pointer;
    }

    .filter {
      padding: 8px 12px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .filter.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 12px;
    }

    article {
      display: flex;
      flex-direction: column;
      min-height: 218px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }

    .title-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .emoji {
      font-size: 25px;
      line-height: 1.2;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
    }

    .tag.app { background: var(--app); }
    .tag.enhancement { background: var(--enhancement); }
    .tag.generic { background: var(--generic); }

    .note {
      flex: 1;
      margin: 12px 0 16px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .install {
      display: inline-flex;
      justify-content: center;
      flex: 1;
      padding: 9px 12px;
      background: var(--accent);
      color: white;
      text-decoration: none;
    }

    .copy {
      padding: 9px 12px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }

    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>MySurge</h1>
    <p class="lead">Surge iOS App 净化与功能增强模块。按编号安装 App 专用模块，通用补漏放到最后。</p>

    <div class="notice">
      已经装过旧版时，请先删除 Uncategorized 中的旧副本再重新安装；本页模块会统一进入 vpromise 分类。微博净化与 Vvebo 时间线修复不要同时启用；智行可能影响携程共用接口。
    </div>

    <div class="filters" aria-label="模块筛选">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="app">App 净化</button>
      <button class="filter" data-filter="enhancement">功能增强</button>
      <button class="filter" data-filter="generic">通用补漏</button>
    </div>

    <section class="grid" id="module-grid"></section>

    <footer>
      模块来自 Yfamilys、原始作者、QingRex 与 fmz200；仓库快照统一增加 vpromise 分类，WPS 和云闪付使用本项目审慎缩减的轻量版本。
      <a href="https://github.com/vpromise/MySurge">查看项目与验证记录</a>
    </footer>
  </main>

  <script>
    const labels = {
      app: "App 净化",
      enhancement: "功能增强",
      generic: "通用补漏"
    };

    const modules = JSON.parse(document.querySelector("#module-data").textContent)
      .sort((a, b) => a.order - b.order);
    const grid = document.querySelector("#module-grid");

    function render(filter = "all") {
      grid.replaceChildren();
      modules
        .filter(module => filter === "all" || module.category === filter)
        .forEach(module => {
          const card = document.createElement("article");
          const installUrl = "surge:///install-module?url=" + encodeURIComponent(module.url);

          card.innerHTML = `
            <div class="title-row">
              <span class="emoji" aria-hidden="true">${module.emoji}</span>
              <div>
                <h2>${module.order}. ${module.name}</h2>
                <div class="meta">来源：${module.source}</div>
              </div>
            </div>
            <span class="tag ${module.category}">${labels[module.category]}</span>
            <p class="note">${module.note}</p>
            <div class="actions">
              <a class="install" href="${installUrl}">安装到 Surge</a>
              <button class="copy" type="button">复制地址</button>
            </div>
          `;

          card.querySelector(".copy").addEventListener("click", async event => {
            const button = event.currentTarget;
            const oldText = button.textContent;
            await navigator.clipboard.writeText(module.url);
            button.textContent = "已复制";
            setTimeout(() => { button.textContent = oldText; }, 1200);
          });

          grid.append(card);
        });
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        render(button.dataset.filter);
      });
    });

    render();
  </script>
</body>
</html>
